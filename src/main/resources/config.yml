# 重生點座標。若移除 x/y/z，會改用該世界的預設重生點 (world.getSpawnLocation())
spawn:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# 隱身時「暫時」附加給玩家的權限節點，隱身解除後會自動移除。
# 請依你實際使用的保護區/領地插件填入對應的 bypass 權限，例如：
#   WorldGuard: "worldguard.region.bypass.*"
# 如果你用的是其他保護區插件，請查該插件文件找對應的 bypass 權限節點，
# 否則「無視保護區移動/傳送限制」這部分不會生效。
bypass-permissions:
  - "worldguard.region.bypass.*"

# /tpa 請求的逾時秒數，超過沒回應會自動取消
tpa-request-timeout-seconds: 30
