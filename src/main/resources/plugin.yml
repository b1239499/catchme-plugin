name: CatchMe
version: '1.0.0'
main: com.fkc.catchme.CatchMePlugin
api-version: '1.21'
author: fkc
description: 讓玩家可以背起另一位玩家 (使用原版乘客機制, Folia 安全)
folia-supported: true

commands:
  catch:
    description: 發送背人請求給另一位玩家
    usage: /catch <玩家名稱>
  uncatch:
    description: 放下你背著的玩家
    usage: /uncatch

permissions:
  catchme.use:
    description: 允許使用 /catch 與 /uncatch
    default: true
  catchme.animal.use:
    description: 允許蹲下+空手右鍵直接背起動物
    default: true
